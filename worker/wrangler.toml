# Cloudflare Worker config for the contact-form submit/resume endpoints.
#
# This is a SECOND, separate config. The repo root `wrangler.toml` configures the
# existing Cloudflare Pages project and must not be merged with this one.
#
# `workers_dev = true` and NO `routes`/`route` block: the custom hostname has not
# been decided yet (design D6, open question). Hostnames are configuration, never
# source literals — the resume URL is built from the RESUME_URL_BASE var below,
# so repointing a domain is a config edit and not a code change.

name = "aag-contact-form-worker"
main = "src/index.ts"

# Pinned ON PURPOSE. This Cloudflare account is shared across several client
# projects, and the deploying identity can see more than one account. Without
# this line `wrangler deploy` either fails asking which account to use, or -
# worse - silently follows a CLOUDFLARE_ACCOUNT_ID environment variable and
# deploys someone else's project into the wrong place. Ambiguity here is not
# worth the convenience of omitting it.
account_id = "0562da4b8c54413c6043de4508c0ba64"

# Must not exceed the date the INSTALLED workerd supports, or every test in the
# worker suite silently runs against different runtime semantics than a deploy
# would get - miniflare falls back with a warning nobody reads and CI calls it
# green. `worker/wrangler.config.test.ts` asserts the relationship, and
# `scripts/test-worker.mjs` fails the run if the fallback ever happens anyway.
#
# To move this forward, upgrade `@cloudflare/vitest-pool-workers` (and with it
# workerd) FIRST, then raise this date to match. Note the pool-workers pin in
# `vitest.worker.config.ts`: 0.13.0+ requires vitest 4.
compatibility_date = "2026-03-10"

workers_dev = true

# Private bucket. Public access (the r2.dev URL and any connected custom domain)
# is a dashboard toggle that is invisible to this file and is asserted separately
# by the S3 preflight script.
[[r2_buckets]]
binding = "RESUMES"
bucket_name = "aag-resumes"

[vars]
# Comma-separated ALLOWLIST of origins allowed to read a /submit response. The
# Worker echoes back the caller's OWN origin when it appears here, and emits no
# Access-Control-Allow-Origin at all when it does not - never `*`, which cannot
# be used with credentials and would hand the response to any site, and never a
# fixed value, which silently breaks every other legitimate origin.
#
# BOTH ENTRIES ARE REQUIRED DURING THE MIGRATION WINDOW. alphaapexgroup.com still
# serves Squarespace, so the widget is mounted on the Webflow staging origin AND
# on production as the cutover proceeds. A list that holds only one of them is
# not a smaller risk, it is a guaranteed outage on the day the other goes live:
# multipart is CORS-safelisted, so NO preflight fires, and a non-matching origin
# still gets its lead delivered and its CV stored while the response is withheld
# from the page. The candidate sees an error and submits again - duplicate leads
# plus a false failure report, which is worse than a clean refusal.
#
# Order does not matter and whitespace is tolerated; empty entries are ignored.
# `worker/wrangler.config.test.ts` asserts this line still names exactly these
# two origins, because the runtime suite reads its own test binding and cannot.
ALLOWED_ORIGINS = "https://www.alphaapexgroup.com,https://alpha-apex-group.webflow.io"

# Base for the resume URL handed to Zapier. Set at deploy time to the resume
# hostname. There is deliberately no source-level fallback: if this is missing
# the Worker fails the request loudly instead of forwarding a lead whose CV link
# points nowhere.
#
# ORIGIN ONLY - scheme and host, e.g. "https://resumes.example.com". Do NOT
# append "/resume": the Worker owns that segment and reads it from the same
# constant its router matches on. A base carrying its own path is REJECTED, and
# it is rejected because the alternative already cost us: the segment lived in
# configuration on the test deploy and in code on the real one, so each side
# assumed the other supplied it and every live lead shipped a link to a 404.
#
# It must also name the SAME host as RESUME_HOST below. Those two bindings
# describe one fact, so they can contradict each other; when they do, the link
# is dead on arrival and nothing in the response says so. A mismatch is refused
# rather than forwarded. (A blank RESUME_HOST is exempt - that is an
# unconfigured deploy, not a contradiction, and failing there would trade a dead
# link for a lost lead.)
RESUME_URL_BASE = ""

# The ONE hostname `GET /resume/<key>` will answer on, and the same hostname the
# Cloudflare Access application must be scoped to.
#
# Access gates a hostname, not a Worker. Every other name that routes here - the
# submit host, workers.dev, a preview URL - would otherwise serve candidate CVs
# with no gate in front of them, because the Access app is on the other name and
# never sees the request. The Worker compares this value and answers 404 to
# everything else.
#
# BLANK ON PURPOSE, and blank means "serve no resume anywhere". The zone is still
# undecided (design open questions), and an unconfigured deploy that streams PII
# from every hostname is far worse than one whose download route is simply dead.
# Set it at deploy time, in the same step that creates the Access app (W3).
RESUME_HOST = ""

# ZAPIER_HOOK_URL, ZAPIER_SHARED_SECRET and ERASURE_SALT are Worker SECRETS.
# They are intentionally absent from this file. Tests inject fakes through
# vitest.worker.config.ts.
